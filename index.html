<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#784600">
<title>San Diego Gelato &amp; Food — Menú Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --br:#784600;--br-d:#5a3300;--br-l:#9c5c10;
  --cr:#FADC99;--cr-l:#FEF3DC;--cr-m:#F8CF70;
  --white:#FFF;--td:#2C1800;--tm:#6b3d00;
  --r-xl:28px;--r-lg:20px;--r-md:14px;
  --sh:0 6px 28px rgba(120,70,0,.16);--sh-s:0 3px 12px rgba(120,70,0,.10);
}
html{scroll-behavior:smooth;}
body{background:#FBF0D9;font-family:'Poppins',sans-serif;color:var(--td);min-height:100vh;overflow-x:hidden;}

/* HEADER */
.hdr{background:var(--br);position:sticky;top:0;z-index:200;box-shadow:0 4px 24px rgba(80,40,0,.35);}
.hdr-inner{max-width:1200px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{display:flex;align-items:center;text-decoration:none;}
.logo-img{height:44px;width:auto;display:block;}
.cart-btn{display:flex;align-items:center;gap:7px;background:var(--cr);color:var(--br);border:none;border-radius:50px;padding:9px 16px;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:var(--sh-s);white-space:nowrap;}
.cart-btn:hover{background:var(--cr-m);transform:scale(1.03);}
.cart-btn:active{transform:scale(.97);}
.cart-icon{width:18px;height:18px;fill:none;stroke:var(--br);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cart-badge{background:var(--br);color:var(--cr);border-radius:50%;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 3px;}

/* HERO */
.hero{background:linear-gradient(145deg,var(--br) 0%,var(--br-l) 100%);padding:28px 16px 22px;text-align:center;position:relative;overflow:hidden;}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(250,220,153,.1);}
.hero::before{width:260px;height:260px;top:-70px;right:-50px;}
.hero::after{width:180px;height:180px;bottom:-50px;left:-40px;}
.hero-inner{max-width:700px;margin:0 auto;position:relative;z-index:1;}
.hero-title{font-family:'Bowlby One SC',cursive;color:var(--cr);font-size:clamp(24px,6vw,46px);line-height:1.05;letter-spacing:.5px;margin-bottom:8px;}
.hero-sub{color:var(--cr-m);font-size:clamp(12px,2.5vw,15px);font-weight:500;}

/* SEDES */
.section{max-width:1200px;margin:0 auto;padding:24px 16px 0;}
.section-ttl{font-family:'Bowlby One SC',cursive;color:var(--br);font-size:clamp(16px,4vw,24px);margin-bottom:14px;text-align:center;}
.sedes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px;}
.sede-card{background:var(--white);border-radius:var(--r-lg);padding:16px 18px;border:2.5px solid transparent;cursor:pointer;transition:all .25s;box-shadow:var(--sh-s);}
.sede-card:hover{border-color:var(--br-l);transform:translateY(-2px);}
.sede-card.active{border-color:var(--br);background:var(--cr-l);}
.sede-name{font-family:'Bowlby One SC',cursive;color:var(--br);font-size:15px;margin-bottom:3px;}
.sede-addr{font-size:12px;color:var(--tm);line-height:1.5;margin-bottom:9px;}
.sede-maps{display:inline-flex;align-items:center;gap:5px;background:var(--br);color:var(--cr);border:none;border-radius:50px;padding:6px 14px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;}
.sede-maps:hover{background:var(--br-d);}
.sede-maps svg{width:12px;height:12px;fill:none;stroke:var(--cr);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.map-wrap{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-s);}
.map-wrap iframe{display:block;width:100%;height:220px;border:none;}

/* CATEGORÍAS */
.cats-wrap{max-width:1200px;margin:0 auto;padding:18px 0 4px;}
.cats-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;-ms-overflow-style:none;}
.cats-scroll::-webkit-scrollbar{display:none;}
.cat-btn{display:flex;align-items:center;gap:6px;background:var(--white);border:2px solid #e8c97a;border-radius:50px;padding:8px 16px;white-space:nowrap;cursor:pointer;font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;color:var(--br);transition:all .2s;box-shadow:var(--sh-s);flex-shrink:0;}
.cat-btn:hover{background:var(--cr-l);transform:translateY(-1px);}
.cat-btn.active{background:var(--br);color:var(--cr);border-color:var(--br);}
.cat-icon{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cat-btn.active .cat-icon{stroke:var(--cr);}

/* PRODUCTOS */
.prods-outer{max-width:1200px;margin:0 auto;padding:10px 16px 130px;}
.cat-section{margin-bottom:28px;}
.cat-section-ttl{font-family:'Bowlby One SC',cursive;color:var(--br);font-size:clamp(16px,4vw,22px);margin-bottom:12px;padding-bottom:6px;border-bottom:3px solid var(--cr-m);}

/* GRID — más productos en mobile */
.prods-grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);}
@media(min-width:480px){.prods-grid{grid-template-columns:repeat(3,1fr);gap:12px;}}
@media(min-width:720px){.prods-grid{grid-template-columns:repeat(3,1fr);gap:14px;}}
@media(min-width:960px){.prods-grid{grid-template-columns:repeat(4,1fr);gap:16px;}}
@media(min-width:1200px){.prods-grid{grid-template-columns:repeat(5,1fr);}}

/* CARD */
.pcard{background:var(--white);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-s);transition:all .25s;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:#e8c97a;}
.pcard:active{transform:scale(.98);}
.pcard-img{width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--cr-l);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.pcard-img img{width:100%;height:100%;object-fit:cover;display:block;}
.pcard-img-ph{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.6;}
.pcard-img-ph svg{width:32px;height:32px;fill:none;stroke:var(--br);stroke-width:1.5;}
.pcard-img-ph span{font-size:9px;font-weight:600;color:var(--br);text-transform:uppercase;letter-spacing:.3px;}
.pcard-body{padding:10px 10px 9px;display:flex;flex-direction:column;flex:1;}
.pcard-name{font-weight:700;font-size:12px;color:var(--td);line-height:1.3;margin-bottom:4px;}
.pcard-desc{font-size:10px;color:#8B6020;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.pcard-price{font-family:'Bowlby One SC',cursive;color:var(--br);font-size:13px;line-height:1;}
.pcard-add{background:var(--br);color:var(--cr);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.pcard-add:hover{background:var(--br-d);transform:scale(1.1);}
.pcard-add:active{transform:scale(.9);}
.pcard-add svg{width:15px;height:15px;fill:none;stroke:var(--cr);stroke-width:2.5;stroke-linecap:round;}

/* Bebidas: card sin imagen, layout horizontal */
.pcard.no-img{flex-direction:row;align-items:center;gap:10px;padding:12px;}
.pcard.no-img .pcard-body{padding:0;flex:1;}
.pcard.no-img .pcard-desc{display:none;}
.pcard.no-img .pcard-foot{margin-top:4px;}

/* FLOATING CART */
.cart-float{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--br);color:var(--cr);border:none;border-radius:50px;padding:13px 24px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 36px rgba(120,70,0,.45);display:flex;align-items:center;gap:12px;z-index:300;transition:all .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;opacity:0;pointer-events:none;}
.cart-float.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:all;}
.cart-float:hover{background:var(--br-d);}
.cft-total{background:var(--cr);color:var(--br);border-radius:50px;padding:3px 12px;font-size:13px;font-weight:800;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(44,24,0,.6);z-index:400;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.open{opacity:1;pointer-events:all;}
.sheet{background:var(--white);border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:92vh;overflow-y:auto;width:100%;max-width:600px;margin:0 auto;-webkit-overflow-scrolling:touch;}
.sheet-handle{width:40px;height:5px;background:#ddd;border-radius:50px;margin:13px auto 0;}
.sheet-hdr{padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--cr-l);position:sticky;top:0;background:var(--white);z-index:1;}
.sheet-ttl{font-family:'Bowlby One SC',cursive;color:var(--br);font-size:18px;}
.sheet-close{background:var(--cr-l);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--br);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.sheet-close:hover{background:var(--cr-m);}
.sheet-body{padding:14px 18px 22px;}

/* CART ITEMS */
.cart-empty{text-align:center;padding:44px 16px;}
.cart-empty svg{width:56px;height:56px;fill:none;stroke:#ccc;stroke-width:1.5;margin-bottom:12px;}
.cart-empty p{font-weight:600;color:#bbb;font-size:14px;}
.cart-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--cr-l);}
.citem-icon{width:48px;height:48px;background:var(--cr-l);border-radius:var(--r-md);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.citem-icon img{width:100%;height:100%;object-fit:cover;}
.citem-icon svg{width:24px;height:24px;fill:none;stroke:var(--br);stroke-width:1.5;}
.citem-info{flex:1;min-width:0;}
.citem-name{font-weight:700;font-size:13px;color:var(--td);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.citem-price{font-weight:600;font-size:12px;color:var(--br);margin-top:1px;}
.citem-qty{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.qty-b{background:var(--cr-l);border:1.5px solid var(--cr-m);border-radius:50%;width:28px;height:28px;cursor:pointer;color:var(--br);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.qty-b:hover{background:var(--cr-m);}
.qty-n{font-weight:700;font-size:13px;min-width:20px;text-align:center;}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:2.5px solid var(--cr-m);margin-top:5px;}
.ct-lbl{font-weight:700;font-size:14px;}
.ct-val{font-family:'Bowlby One SC',cursive;font-size:22px;color:var(--br);}

/* FORM */
.form-ttl{font-family:'Bowlby One SC',cursive;color:var(--br);font-size:16px;margin:18px 0 12px;}
.fgrp{margin-bottom:12px;}
.flbl{display:block;font-weight:600;font-size:11.5px;color:var(--tm);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.finput{width:100%;background:var(--cr-l);border:2px solid #e8c97a;border-radius:var(--r-md);padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:var(--td);outline:none;transition:border .2s;-webkit-appearance:none;}
.finput:focus{border-color:var(--br);}
.finput::placeholder{color:#C9A850;}
.sede-opts,.pago-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.sopt,.popt{background:var(--cr-l);border:2px solid #e8c97a;border-radius:var(--r-md);padding:13px;text-align:center;cursor:pointer;transition:all .2s;}
.sopt:hover,.popt:hover{border-color:var(--br);}
.sopt.sel,.popt.sel{border-color:var(--br);background:var(--br);color:var(--cr);}
.sopt svg,.popt svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;margin-bottom:5px;}
.sopt-name,.popt-name{font-weight:700;font-size:12px;display:block;}
.sopt-addr{font-size:10px;opacity:.75;margin-top:1px;display:block;}
.send-btn{width:100%;background:var(--br);color:var(--cr);border:none;border-radius:var(--r-lg);padding:16px;font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;cursor:pointer;transition:all .2s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--sh);}
.send-btn:hover{background:var(--br-d);transform:scale(1.02);}
.send-btn:active{transform:scale(.97);}
.send-btn svg{width:20px;height:20px;fill:#25D366;flex-shrink:0;}

/* PRODUCT DETAIL */
.pmod{position:fixed;inset:0;background:rgba(44,24,0,.7);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.pmod.open{opacity:1;pointer-events:all;}
.pmod-sheet{background:var(--white);border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;position:relative;}
.pmod-img{width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--cr-l);}
.pmod-img img{width:100%;height:100%;object-fit:cover;display:block;}
.pmod-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.pmod-img-ph svg{width:64px;height:64px;fill:none;stroke:var(--br);stroke-width:1.3;opacity:.5;}
.pmod-close{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--br);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.pmod-body{padding:18px 20px 26px;}
.pmod-name{font-family:'Bowlby One SC',cursive;color:var(--br);font-size:clamp(18px,5vw,24px);margin-bottom:3px;}
.pmod-price{font-weight:800;font-size:18px;color:var(--td);margin-bottom:10px;}
.pmod-desc{font-size:13px;color:var(--tm);line-height:1.6;margin-bottom:20px;}
.pmod-actions{display:flex;align-items:center;gap:12px;}
.qty-ctrl{display:flex;align-items:center;gap:10px;background:var(--cr-l);border-radius:50px;padding:8px 16px;border:2px solid var(--cr-m);}
.padd{flex:1;background:var(--br);color:var(--cr);border:none;border-radius:50px;padding:14px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;}
.padd:hover{background:var(--br-d);}

/* TOAST */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-14px);background:var(--br);color:var(--cr);border-radius:50px;padding:11px 22px;font-weight:700;font-size:13px;z-index:600;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.pcard{animation:fadeUp .3s ease both;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <a class="hdr-logo" href="#" aria-label="San Diego Gelato and Food">
    </a>
    <button class="cart-btn" onclick="openCart()" aria-label="Ver carrito">
      <svg class="cart-icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Mi pedido
      <div class="cart-badge" id="cartCount">0</div>
    </button>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <h1 class="hero-title">San Diego<br>Gelato &amp; Food</h1>
    <p class="hero-sub">El sabor que te enamora · Neiva, Huila · 2 Sedes · Domicilios</p>
  </div>
</div>

<div class="section">
  <div class="section-ttl">Nuestras Sedes</div>
  <div class="sedes-grid">
    <div class="sede-card" id="scNorte">
      <div class="sede-name">Sede Norte</div>
      <div class="sede-addr">Carrera 1 #30-36, esquina Cándido<br>Tel: 313 850 6011</div>

    </div>
    <div class="sede-card" id="scSur">
      <div class="sede-name">Sede Sur</div>
      <div class="sede-addr">Calle 23B Sur #25-04, diagonal UIS Sur<br>Tel: 321 929 3163</div>

    </div>
  </div>

</div>

<div class="cats-wrap">
  <div class="cats-scroll" id="catScroll">
    <button class="cat-btn active" onclick="filterCat('all',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Todo
    </button>
    <button class="cat-btn" onclick="filterCat('hamburguesas',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><path d="M3 11l1-1h16l1 1"/><path d="M5 11V9a7 7 0 0 1 14 0v2"/><rect x="2" y="11" width="20" height="3" rx="1"/><path d="M20 14l1 3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1l1-3"/></svg>
      Hamburguesas
    </button>
    <button class="cat-btn" onclick="filterCat('perros',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><path d="M7 14c0-2.5 10-2.5 10 0"/><path d="M3 14h18"/><path d="M5 14V9h14v5"/><path d="M5 9c0-3 2-5 7-5s7 2 7 5"/></svg>
      Perros
    </button>
    <button class="cat-btn" onclick="filterCat('rapida',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><path d="M3 11l1 7h16l1-7"/><rect x="2" y="7" width="20" height="4" rx="1"/><path d="M9 7V4h6v3"/></svg>
      Comida Rápida
    </button>
    <button class="cat-btn" onclick="filterCat('platos',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M3 12a9 9 0 0 0 18 0"/><path d="M12 3v4"/></svg>
      Platos
    </button>
    <button class="cat-btn" onclick="filterCat('helados',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><path d="M12 22 8 10h8z"/><circle cx="12" cy="7" r="5"/></svg>
      Copas
    </button>
    <button class="cat-btn" onclick="filterCat('postres',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><rect x="2" y="14" width="20" height="2" rx="1"/><path d="M5 14V9a7 7 0 0 1 14 0v5"/><path d="M12 2v4"/></svg>
      Postres &amp; Waffles
    </button>
    <button class="cat-btn" onclick="filterCat('infantil',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M8 14h8a4 4 0 0 1 4 4v1H4v-1a4 4 0 0 1 4-4z"/></svg>
      Infantil
    </button>
    <button class="cat-btn" onclick="filterCat('bebidas',this)">
      <svg class="cat-icon" viewBox="0 0 24 24"><path d="M17 3l2 12H5L7 3z"/><path d="M5 15a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2"/></svg>
      Bebidas
    </button>
  </div>
</div>

<div class="prods-outer" id="prodsOuter"></div>

<button class="cart-float" id="cartFloat" onclick="openCart()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--cr)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
  Ver pedido
  <span class="cft-total" id="cftTotal">$0</span>
</button>

<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <div class="sheet-ttl">Mi Pedido</div>
      <button class="sheet-close" onclick="closeCart()">&#x2715;</button>
    </div>
    <div class="sheet-body" id="cartBody"></div>
  </div>
</div>

<div class="pmod" id="pmod">

const ALL_ITEMS=Object.values(MENU).flatMap(c=>c.items);
let cart=[],curProd=null,dqtyVal=1,selSede='',selPago='';
const fmt=n=>'$'+n.toLocaleString('es-CO');

function imgEl(id,noImg){
  if(noImg)return '';
  const src=IMG[id];
  if(src)return `<img src="${src}" alt="" loading="lazy">`;
  return `<div class="pcard-img-ph">${SVG_ICE}<span>Foto pronto</span></div>`;
}

function renderProds(cat){
  const outer=document.getElementById('prodsOuter');
  if(cat==='all'){
    outer.innerHTML=Object.entries(MENU).map(([k,c])=>
      `<div class="cat-section">
        <div class="cat-section-ttl">${c.label}</div>
        <div class="prods-grid${c.noImg?' bev-grid':''}">${c.items.map(p=>card(p,c.noImg)).join('')}</div>
      </div>`).join('');
  }else{
    const c=MENU[cat];
    outer.innerHTML=`<div class="prods-grid${c.noImg?' bev-grid':''}">${c.items.map(p=>card(p,c.noImg)).join('')}</div>`;
  }
}

function card(p,noImg){
  if(noImg){
    return `<div class="pcard no-img" onclick="quickAdd('${p.id}')">
      <div class="pcard-body">
        <div class="pcard-name">${p.name}</div>
        <div class="pcard-foot">
          <div class="pcard-price">${fmt(p.price)}</div>
          <button class="pcard-add" onclick="event.stopPropagation();quickAdd('${p.id}')" aria-label="Agregar">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  }
  return `<div class="pcard" onclick="openProd('${p.id}')">
    <div class="pcard-img">${imgEl(p.id,noImg)}</div>
    <div class="pcard-body">
      <div class="pcard-name">${p.name}</div>
      <div class="pcard-desc">${p.desc}</div>
      <div class="pcard-foot">
        <div class="pcard-price">${fmt(p.price)}</div>
        <button class="pcard-add" onclick="event.stopPropagation();quickAdd('${p.id}')" aria-label="Agregar">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </div>`;
}

function filterCat(cat,btn){
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderProds(cat);
  document.getElementById('prodsOuter').scrollIntoView({behavior:'smooth',block:'start'});
}

function quickAdd(id){
  const p=ALL_ITEMS.find(x=>x.id===id);
  if(!p)return;
  addItem(p,1);showToast(p.name+' agregado');
}
function addItem(p,qty){
  const ex=cart.find(x=>x.id===p.id);
  if(ex)ex.qty+=qty;else cart.push({...p,qty});
  updateCartUI();
}
function updateCartUI(){
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const count=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('cartCount').textContent=count;
  document.getElementById('cftTotal').textContent=fmt(total);
  const fb=document.getElementById('cartFloat');
  count>0?fb.classList.add('show'):fb.classList.remove('show');
}
function openCart(){
  document.getElementById('cartOverlay').classList.add('open');
  document.body.style.overflow='hidden';renderCart();
}
function closeCart(){
  document.getElementById('cartOverlay').classList.remove('open');
  document.body.style.overflow='';
}
function renderCart(){
  const body=document.getElementById('cartBody');
  if(cart.length===0){
    body.innerHTML=`<div class="cart-empty"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><p>Tu carrito está vacío</p></div>`;
    return;
  }
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const items=cart.map((item,i)=>`
    <div class="cart-item">
      <div class="citem-icon">${IMG[item.id]?`<img loading="lazy" src="${IMG[item.id]}" alt="">`:item.svg}</div>
      <div class="citem-info">
        <div class="citem-name">${item.name}</div>
        <div class="citem-price">${fmt(item.price)} c/u</div>
      </div>
      <div class="citem-qty">
        <button class="qty-b" onclick="chQty(${i},-1)">&#x2212;</button>
        <span class="qty-n">${item.qty}</span>
        <button class="qty-b" onclick="chQty(${i},1)">&#x2b;</button>
      </div>
    </div>`).join('');
  body.innerHTML=items+
    `<div class="cart-total"><span class="ct-lbl">Total</span><span class="ct-val">${fmt(total)}</span></div>`+
    checkoutForm();
  if(selSede){const el=document.getElementById('so_'+selSede);if(el)el.classList.add('sel');}
  if(selPago){const el=document.getElementById('po_'+selPago);if(el)el.classList.add('sel');}
}
function chQty(i,d){
  cart[i].qty+=d;
  if(cart[i].qty<=0)cart.splice(i,1);
  updateCartUI();renderCart();
}
function checkoutForm(){
  return `<div class="form-ttl">Tus Datos</div>
  <div class="fgrp"><label class="flbl">Nombre completo</label><input class="finput" type="text" id="fNom" placeholder="Tu nombre..."/></div>
  <div class="fgrp"><label class="flbl">Teléfono</label><input class="finput" type="tel" id="fTel" placeholder="310 000 0000"/></div>
  <div class="fgrp"><label class="flbl">Dirección de entrega</label><input class="finput" type="text" id="fDir" placeholder="Barrio, calle, carrera..."/></div>
  <div class="form-ttl">Elige tu Sede</div>
  <div class="sede-opts">
    <div class="sopt" id="so_norte" onclick="selSedeF('norte')">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="sopt-name">Sede Norte</span><span class="sopt-addr">Cra 1 #30-36</span>
    </div>
    <div class="sopt" id="so_sur" onclick="selSedeF('sur')">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="sopt-name">Sede Sur</span><span class="sopt-addr">Cll 23B Sur #25-04</span>
    </div>
  </div>
  <div class="form-ttl">Método de Pago</div>
  <div class="pago-opts">
    <div class="popt" id="po_transferencia" onclick="selPagoF('transferencia')">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span class="popt-name">Transferencia</span>
    </div>
    <div class="popt" id="po_efectivo" onclick="selPagoF('efectivo')">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="popt-name">Efectivo</span>
    </div>
  </div>
  <div class="fgrp"><label class="flbl">Observaciones (opcional)</label><textarea class="finput" id="fNota" placeholder="Sin tomate, extra queso..." style="height:65px;resize:none;"></textarea></div>
  <button class="send-btn" onclick="sendOrder()">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    Enviar Pedido por WhatsApp
  </button>`;
}
function selSedeF(s){selSede=s;document.querySelectorAll('.sopt').forEach(e=>e.classList.remove('sel'));const el=document.getElementById('so_'+s);if(el)el.classList.add('sel');}
function selPagoF(p){selPago=p;document.querySelectorAll('.popt').forEach(e=>e.classList.remove('sel'));const el=document.getElementById('po_'+p);if(el)el.classList.add('sel');}
function sendOrder(){
  const nom=(document.getElementById('fNom')||{}).value||'';
  const tel=(document.getElementById('fTel')||{}).value||'';
  const dir=(document.getElementById('fDir')||{}).value||'';
  const nota=(document.getElementById('fNota')||{}).value||'';
  if(!nom.trim()||!tel.trim()||!dir.trim()){showToast('Completa nombre, teléfono y dirección');return;}
  if(!selSede){showToast('Elige una sede');return;}
  if(!selPago){showToast('Elige método de pago');return;}
  if(cart.length===0){showToast('Tu carrito está vacío');return;}
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const sedeLabel=selSede==='norte'?'Sede Norte — Cra 1 #30-36':'Sede Sur — Cll 23B Sur #25-04';
  const waNum=selSede==='norte'?'573138506011':'573219293163';
  const pagoLbl=selPago==='transferencia'?'💳 Transferencia':'💵 Efectivo';
  const itms=cart.map(i=>`   ▸ ${i.name} x${i.qty}  →  ${fmt(i.price*i.qty)}`).join('\n');
  const msg=`🍔🍦 *PEDIDO SAN DIEGO*\n━━━━━━━━━━━━━━━━━\n🏪 *Sede:* ${sedeLabel}\n━━━━━━━━━━━━━━━━━\n👤 *Nombre:* ${nom}\n📱 *Teléfono:* ${tel}\n📍 *Dirección:* ${dir}\n━━━━━━━━━━━━━━━━━\n🛒 *PEDIDO:*\n${itms}\n━━━━━━━━━━━━━━━━━\n💰 *TOTAL: ${fmt(total)}*\n${pagoLbl}${nota?'\n💬 *Nota:* '+nota:''}\n━━━━━━━━━━━━━━━━━\n¡Gracias por tu pedido! 🤩`;
  window.open('https://wa.me/'+waNum+'?text='+encodeURIComponent(msg),'_blank');
}
function openProd(id){
  const p=ALL_ITEMS.find(x=>x.id===id);if(!p)return;
  curProd=p;dqtyVal=1;
  const mi=document.getElementById('pmodImg');
  mi.innerHTML=IMG[p.id]?`<img loading="lazy" src="${IMG[p.id]}" alt="${p.name}">`:`<div class="pmod-img-ph">${p.svg}</div>`;
  document.getElementById('pmodName').textContent=p.name;
  document.getElementById('pmodPrice').textContent=fmt(p.price);
  document.getElementById('pmodDesc').textContent=p.desc;
  document.getElementById('dqtyN').textContent=1;
  document.getElementById('pmod').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePmod(){document.getElementById('pmod').classList.remove('open');document.body.style.overflow='';}
function dqty(d){dqtyVal=Math.max(1,dqtyVal+d);document.getElementById('dqtyN').textContent=dqtyVal;}
function addFromDetail(){if(!curProd)return;addItem(curProd,dqtyVal);showToast(curProd.name+' (x'+dqtyVal+') agregado');closePmod();}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
document.getElementById('cartOverlay').addEventListener('click',function(e){if(e.target===this)closeCart();});
document.getElementById('pmod').addEventListener('click',function(e){if(e.target===this)closePmod();});
renderProds('all');
</script>
